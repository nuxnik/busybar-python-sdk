name: Publish to test PyPI

on:
  push:
    branches: [main]
    paths:
      - "openapi.yaml"
  workflow_dispatch:

# Releases are driven by changes to the OpenAPI spec. Generated metadata commits
# do not retrigger publishing; use workflow_dispatch for an intentional retry.
concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, tag and publish
    runs-on: ubuntu-latest
    steps:
      # Full history so the tag collision check can resolve tags that
      # point at commits older than the default shallow checkout.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Extract and validate API version from openapi.yaml
        id: api-version
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          VERSION=$(python3 -c '
          import re
          import sys
          import yaml

          with open("openapi.yaml", encoding="utf-8") as handle:
              spec = yaml.safe_load(handle)
          version = str(spec["info"]["version"]).strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              print(
                  "error: openapi.yaml info.version %r is not a valid "
                  "<major>.<minor>.<patch> API version" % (version,),
                  file=sys.stderr,
              )
              sys.exit(1)
          print(version)
          ')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing version ${VERSION}"

      - name: Build SDK from openapi.yaml
        env:
          PACKAGE_VERSION: ${{ steps.api-version.outputs.version }}
        run: ./bin/build

      - name: Finalize packaging metadata
        id: finalize
        env:
          RELEASE_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet tomlkit
          python3 bin/release-metadata "${RELEASE_VERSION}"

          # Detect both tracked changes and newly generated files.
          if git diff --quiet \
              && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo "Working tree already conforms to ${RELEASE_VERSION}."
              if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
                  TAG_COMMIT="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
                  HEAD_COMMIT="$(git rev-parse HEAD)"
                  if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
                      echo "::error::Tag v${RELEASE_VERSION} already exists at ${TAG_COMMIT} (HEAD is ${HEAD_COMMIT}); refusing to re-release ${RELEASE_VERSION}."
                      exit 1
                  fi
                  echo "Existing tag v${RELEASE_VERSION} points at HEAD; continuing to retry the package publish."
                  echo "needs_commit=false" >> "${GITHUB_OUTPUT}"
                  echo "needs_tag=false" >> "${GITHUB_OUTPUT}"
              else
                  echo "No metadata changes and no existing tag; tagging current HEAD."
                  echo "needs_commit=false" >> "${GITHUB_OUTPUT}"
                  echo "needs_tag=true" >> "${GITHUB_OUTPUT}"
              fi
          else
              # Changed files may not reuse an existing version tag.
              if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
                  TAG_COMMIT="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
                  echo "::error::Tag v${RELEASE_VERSION} already exists at ${TAG_COMMIT}; refusing to release changed files under the same version."
                  exit 1
              fi
              echo "Proceeding with release of ${RELEASE_VERSION}"
              echo "needs_commit=true" >> "${GITHUB_OUTPUT}"
              echo "needs_tag=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit and push finalized metadata
        if: steps.finalize.outputs.needs_commit == 'true'
        env:
          RELEASE_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${RELEASE_VERSION}: finalize packaging metadata"
          git push origin HEAD:main

      - name: Create and push release tag
        if: steps.finalize.outputs.needs_tag == 'true'
        env:
          RELEASE_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Build and publish to test PyPI
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_PYPI_TOKEN:-}" ]; then
              echo "::error::Repository secret TEST_PYPI_TOKEN is not set; refusing to publish."
              exit 1
          fi
          uv build
          # testpypi credentials: PyPI accepts a token as Basic auth with
          # the fixed username __token__; uv reads them per index name.
          UV_INDEX_TESTPYPI_USERNAME="__token__" \
          UV_INDEX_TESTPYPI_PASSWORD="${TEST_PYPI_TOKEN}" \
          uv publish --index testpypi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
