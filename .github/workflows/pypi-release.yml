name: Publish to test PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushing the metadata commit back to main re-triggers this workflow;
# the guards in "Finalize packaging metadata" make that re-run a no-op.
concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, tag and publish
    runs-on: ubuntu-latest
    steps:
      # Full history so the tag collision check can resolve tags that
      # point at commits older than the default shallow checkout.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Extract and validate API version from openapi.yaml
        id: api-version
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          VERSION=$(python3 -c '
import re
import sys
import yaml

with open("openapi.yaml", encoding="utf-8") as handle:
    spec = yaml.safe_load(handle)
version = str(spec["info"]["version"]).strip()
if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
    print(
        "error: openapi.yaml info.version %r is not a valid "
        "<major>.<minor>.<patch> API version" % (version,),
        file=sys.stderr,
    )
    sys.exit(1)
print(version)
')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing version ${VERSION}"

      - name: Build SDK from openapi.yaml
        env:
          PACKAGE_VERSION: ${{ steps.api-version.outputs.version }}
        run: ./bin/build

      - name: Finalize packaging metadata
        env:
          RELEASE_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet tomlkit
          python3 bin/release-metadata "${RELEASE_VERSION}"

          # No-op guard: metadata and build artifacts already conform to
          # this version -> complete without committing, tagging, or
          # publishing. (git diff --exit-code plus untracked files, so a
          # freshly generated file can never be missed.)
          if git diff --exit-code --quiet \
              && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo "Working tree already conforms to ${RELEASE_VERSION}; nothing to release."
              exit 0
          fi

          # Tag collision guard.
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
              TAG_COMMIT="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
              HEAD_COMMIT="$(git rev-parse HEAD)"
              if [ "${TAG_COMMIT}" = "${HEAD_COMMIT}" ]; then
                  echo "Tag v${RELEASE_VERSION} already points at HEAD; this version is already released."
                  exit 0
              fi
              echo "::error::Tag v${RELEASE_VERSION} already exists at ${TAG_COMMIT} (HEAD is ${HEAD_COMMIT}); refusing to re-release ${RELEASE_VERSION}."
              exit 1
          fi
          echo "Proceeding with release of ${RELEASE_VERSION}"

      - name: Commit and push finalized metadata
        env:
          RELEASE_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${RELEASE_VERSION}: finalize packaging metadata"
          git push origin HEAD:main

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ steps.api-version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Build and publish to test PyPI
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_PYPI_TOKEN:-}" ]; then
              echo "::error::Repository secret TEST_PYPI_TOKEN is not set; refusing to publish."
              exit 1
          fi
          uv build
          # testpypi credentials: PyPI accepts a token as Basic auth with
          # the fixed username __token__; uv reads them per index name.
          UV_INDEX_TESTPYPI_USERNAME="__token__" \
          UV_INDEX_TESTPYPI_PASSWORD="${TEST_PYPI_TOKEN}" \
          uv publish --index testpypi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
